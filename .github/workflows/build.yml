name: Build Themes

# Fork-only workflow: rebuilds build/midnight.css and build/ayu.css whenever
# src or scripts change (e.g. after merging upstream updates) and commits the
# result, so both build files always stay in sync with src.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.js
      - uses: EndBug/add-and-commit@v10
        with:
          default_author: github_actions
          message: "chore: rebuild themes"
          add: "build"
          fetch: true
